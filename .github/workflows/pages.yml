name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "megajardines/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:      # lo usa sincronizar.yml después de actualizar el inventario

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main     # siempre la última versión (incluye el commit de la sincronización)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: megajardines
      - id: deployment
        uses: actions/deploy-pages@v4
